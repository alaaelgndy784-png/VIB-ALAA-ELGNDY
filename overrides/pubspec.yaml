name: vib_sales
version: 0.2.12+4015
publish_to: none
description: VIB sales, inventory and branches

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  intl: ^0.20.2
  local_auth: ^2.3.0
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  tesseract_ocr: ^0.5.0
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.3.1
  record: ^6.2.1
  audioplayers: ^6.5.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/vip-logo.png
    - assets/tessdata_config.json
    - assets/tessdata/
    - assets/fonts/DejaVuSans.ttf
    - assets/icons/manager/mipmap-xxxhdpi/ic_launcher.png

