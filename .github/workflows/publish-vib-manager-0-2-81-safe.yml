name: Publish Verified VIB Manager 0.2.81 Above Installed 0.2.80

permissions:
  contents: write
  actions: read

on:
  push:
    paths:
      - '.github/workflows/publish-vib-manager-0-2-81-safe.yml'
  workflow_dispatch:

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download tested VIB Manager 0.2.77 APK
        uses: actions/download-artifact@v4
        with:
          run-id: 44858425831
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: VIB-SALES-MANAGER-APK
          path: manager-files

      - name: Verify arm64 versionCode 22081 above installed 20080 and matching original signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous-manager
          gh release download vib-manager-0.2.76-fifo-profit-20261115 --repo "$GITHUB_REPOSITORY" --pattern VIB-SALES-MANAGER.apk --dir previous-manager
          OLD=previous-manager/VIB-SALES-MANAGER.apk
          NEW=manager-files/VIB-SALES-MANAGER.apk
          test -s "$OLD"
          test -s "$NEW"
          unzip -t "$NEW" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$SIGNER"
          "$AAPT" dump badging "$NEW" > /tmp/new-manager-badging.txt
          "$AAPT" dump badging "$OLD" > /tmp/old-manager-badging.txt
          head -n 3 /tmp/new-manager-badging.txt
          head -n 3 /tmp/old-manager-badging.txt
          grep -F "name='com.alaa.vibsales.managerscan'" /tmp/new-manager-badging.txt
          grep -F "versionCode='22081'" /tmp/new-manager-badging.txt
          grep -F "versionName='0.2.81'" /tmp/new-manager-badging.txt
          grep -F "versionCode='12216'" /tmp/old-manager-badging.txt
          "$SIGNER" verify --print-certs "$NEW" | tee /tmp/new-manager-certificate.txt
          "$SIGNER" verify --print-certs "$OLD" | tee /tmp/old-manager-certificate.txt
          NEW_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/new-manager-certificate.txt | head -1 | tr -d '[:space:]')"
          OLD_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/old-manager-certificate.txt | head -1 | tr -d '[:space:]')"
          test -n "$NEW_SHA"
          test "$NEW_SHA" = "$OLD_SHA"
          test 22081 -gt 20080
          test "$NEW_SHA" = "5b0b9b961fea105fd0ae225b7400046be9c98bad40f13ea13a8c1929811d2a2f"
          echo "Verified in-place compatibility: package unchanged, arm64 versionCode 22081 > installed 20080, signer matched"
          sha256sum "$NEW" > manager-files/SHA256SUMS.txt

      - name: Publish verified manager APK direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vib-manager-0.2.81-safe-20261121
          name: VIB Manager 0.2.81 - Verified In-Place Update
          target_commitish: ${{ github.sha }}
          body: "Android arm64 VIB Manager 0.2.81 APK, versionCode 22081. Unit checks and invoice/PDF tests passed. Same application ID and signing SHA-256 as current installed 0.2.80 (code 20080) according to diagnostic screenshot. Sourced from current GitHub code; may differ in features from the user-installed 0.2.80. Back up data before installing; not tested on user phone."
          files: manager-files/VIB-SALES-MANAGER.apk
          overwrite_files: true
          make_latest: false
