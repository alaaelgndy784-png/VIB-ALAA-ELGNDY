name: Deploy VIB Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'overrides/firebase/firestore.rules'
      - 'overrides/firebase/firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore rules
        working-directory: overrides/firebase/rules-tests
        run: npm ci && npm test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        working-directory: overrides/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only firestore:rules --project vib-sales --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only firestore:rules --project vib-sales --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Missing FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT repository secret"
            exit 1
          fi
