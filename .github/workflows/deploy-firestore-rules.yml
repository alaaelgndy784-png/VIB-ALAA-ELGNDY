name: Deploy VIB Firestore Rules
# Run the configured Firebase deployment for the owner's requested rules update.

on:
  workflow_dispatch:
  push:
    paths:
      - 'overrides/firebase/firestore.rules'
      - 'overrides/firebase/rules-tests/**'
      - 'overrides/firebase/functions/**'
      - 'overrides/firebase/firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore rules
        working-directory: overrides/firebase/rules-tests
        run: npm ci && npm test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        working-directory: overrides/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only firestore:rules --project vib-sales --non-interactive
            firebase deploy --only functions:createStaffSale --project vib-sales --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only firestore:rules --project vib-sales --token "$FIREBASE_TOKEN" --non-interactive
            firebase deploy --only functions:createStaffSale --project vib-sales --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Missing FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT repository secret"
            exit 1
          fi

  deploy-manager-visit-notification:
    if: github.ref == 'refs/heads/feature/manager-background-visit-push-0-2-96-20261123'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test visit notification payload and existing Firebase functions
        run: node --test overrides/firebase/functions/*.test.js
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy only customer visit push function
        working-directory: overrides/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only functions:notifyEmployeeVisitCreated --project vib-sales --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only functions:notifyEmployeeVisitCreated --project vib-sales --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Firebase deployment credentials are not configured. FCM pushes are not yet active."
            exit 1
          fi
