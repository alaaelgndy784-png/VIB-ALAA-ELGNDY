name: Build Independent VIB Sales Apps

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches: ['ui/vib-sales-0.2.54-cash-credit-colors']
  push:
    paths:
      - 'VIB-SALES-INDEPENDENT-SOURCE.zip'
      - '.github/workflows/build-vib-sales-independent.yml'
      - 'overrides/**'

jobs:
  verify-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: overrides/firebase/rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test overrides/firebase/functions/*.test.js
      - run: npm ci && npm test
        working-directory: overrides/firebase/rules-tests
  build:
    needs: verify-rules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [manager]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Java; ubuntu-latest can ship a newer JDK (e.g. 25)
      # that older Gradle/Android tooling cannot parse.
      - name: Set up supported Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: vib-sales-stable-android-signing-v1

      - name: Extract independent sales project
        run: |
          mkdir VIB-SALES-INDEPENDENT
          unzip -q VIB-SALES-INDEPENDENT-SOURCE.zip -d VIB-SALES-INDEPENDENT
          cp overrides/lib/*.dart VIB-SALES-INDEPENDENT/lib/
          mkdir -p VIB-SALES-INDEPENDENT/vib_overrides
          cp overrides/android/prepare_cheque_notifications.py VIB-SALES-INDEPENDENT/vib_overrides/
          cp overrides/android/apply_store_movement.py VIB-SALES-INDEPENDENT/vib_overrides/
          cp overrides/android/apply_manager_thermal_printing.py VIB-SALES-INDEPENDENT/vib_overrides/
          cp overrides/android/apply_manager_offline_presentation.py VIB-SALES-INDEPENDENT/vib_overrides/
          cp overrides/pubspec.yaml VIB-SALES-INDEPENDENT/pubspec.yaml
          cp overrides/assets/vip-logo.png VIB-SALES-INDEPENDENT/assets/vip-logo.png
          cp overrides/assets/login-chime.wav VIB-SALES-INDEPENDENT/assets/login-chime.wav
          mkdir -p VIB-SALES-INDEPENDENT/test
          cp overrides/test/*.dart VIB-SALES-INDEPENDENT/test/
          mkdir -p VIB-SALES-INDEPENDENT/assets/tessdata
          printf '%s\n' '{"files":["ara.traineddata","eng.traineddata"]}' > VIB-SALES-INDEPENDENT/assets/tessdata_config.json
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata --output VIB-SALES-INDEPENDENT/assets/tessdata/ara.traineddata
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata --output VIB-SALES-INDEPENDENT/assets/tessdata/eng.traineddata
          mkdir -p VIB-SALES-INDEPENDENT/assets/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf VIB-SALES-INDEPENDENT/assets/fonts/DejaVuSans.ttf

      - name: Create independent Android platform
        env:
          APP: ${{ matrix.app }}
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          flutter create --platforms=android --org com.alaa.vibsales --project-name "$APP" .
          python3 vib_overrides/apply_store_movement.py lib/main.dart
          python3 vib_overrides/apply_manager_thermal_printing.py lib/main.dart
          if [ "$APP" = manager ]; then python3 vib_overrides/apply_manager_offline_presentation.py lib/main.dart; fi
          python3 vib_overrides/prepare_cheque_notifications.py

      - name: Prepare ${{ matrix.app }} app
        env:
          APP: ${{ matrix.app }}
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          APP_ID='com.alaa.vibsales.staffscan'
          LABEL='VIB Staff'
          if [ "$APP" = manager ]; then
            APP_ID='com.alaa.vibsales.managerscan'
            LABEL='VIB Manager'
          fi
          printf '%s\n' 'android.newDsl=false' 'android.builtInKotlin=false' >> android/gradle.properties
          sed -i 's/^name: .*/name: vib_sales/' pubspec.yaml
          python3 - "$APP" "$LABEL" "$APP_ID" <<'PY'
          from pathlib import Path
          import re, sys
          app, label, app_id = sys.argv[1:]
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:label="[^"]+"', f'android:label="{label}"', text, count=1)
          permissions = '''    <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'''
          root = re.search(r'<manifest\b[^>]*>', text)
          if root is None: raise SystemExit('Android manifest root missing')
          text = text[:root.end()] + '\n' + permissions + text[root.end():]
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = re.sub(r'applicationId = "[^"]+"', f'applicationId = "{app_id}"', text, count=1)
          gradle.write_text(text)
          activity = Path(f'android/app/src/main/kotlin/com/alaa/vibsales/{app}/MainActivity.kt')
          text = activity.read_text().replace('FlutterActivity', 'FlutterFragmentActivity')
          activity.write_text(text)
          source = Path('lib/main.dart')
          text = source.read_text()
          if app == 'manager':
              text = re.sub(r"'role':\s*'pending',\s*'active':\s*false", "'role': 'owner', 'active': true", text)
          source.write_text(text)
          PY
          if [ -d "assets/icons/$APP" ]; then cp -r "assets/icons/$APP"/mipmap-* android/app/src/main/res/; fi
          base64 -d ../overrides/assets/vib-launcher.png.b64 > /tmp/vib-launcher.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp /tmp/vib-launcher.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"; done
          cp firebase/google-services.json android/app/google-services.json
          if [ "$APP" = manager ]; then python3 ../overrides/android/configure_manager_ringtone.py "$APP"; fi
          if [ "$APP" = manager ]; then python3 ../overrides/android/generate_short_approval_sound.py; fi
          flutter pub get

      - name: Verify invoice PDF rendering
        if: matrix.app == 'manager'
        working-directory: VIB-SALES-INDEPENDENT
        run: flutter test test/customer_payment_sources_test.dart test/sale_cost_reconciliation_test.dart test/store_movement_test.dart test/receipt_voucher_test.dart test/accounting_test.dart test/invoice_pdf_test.dart test/cheques_test.dart test/chat_alerts_test.dart test/approval_alerts_test.dart test/archived_purchase_view_test.dart test/return_quota_message_test.dart test/dashboard_metric_icons_test.dart test/product_import_test.dart test/inventory_tools_test.dart test/inventory_rows_test.dart test/invoice_serial_core_test.dart test/invoice_parties_test.dart test/reports_test.dart test/pending_sale_data_test.dart test/pending_sale_review_test.dart test/customer_sales_report_test.dart test/sales_invoice_cancellations_test.dart test/product_invoice_movement_test.dart test/product_movement_layout_test.dart test/payment_receipt_scope_test.dart test/legacy_purchase_groups_test.dart test/return_invoice_test.dart

      - name: Upload invoice PDF previews
        if: matrix.app == 'manager'
        uses: actions/upload-artifact@v4
        with:
          name: VIB-INVOICE-PDF-PREVIEWS
          path: |
            VIB-SALES-INDEPENDENT/dist/*.pdf
            VIB-SALES-INDEPENDENT/dist/*.png
          if-no-files-found: error

      - name: Build ${{ matrix.app }} APK
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          flutter clean
          flutter pub get
          sed -i -E 's/versionCode = .*/versionCode = 8206/; s/versionName = .*/versionName = "0.2.66"/' android/app/build.gradle.kts
          grep -q 'versionCode = 8206' android/app/build.gradle.kts
          grep -q 'versionName = "0.2.66"' android/app/build.gradle.kts
          flutter build apk --release --split-per-abi --build-number=8206 --build-name=0.2.66
          mkdir -p dist
          if [ "${{ matrix.app }}" = manager ]; then cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/VIB-SALES-MANAGER.apk; else cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/VIB-SALES-STAFF.apk; fi

      - name: Verify short manager approval WAV is bundled in the APK
        if: matrix.app == 'manager'
        working-directory: VIB-SALES-INDEPENDENT
        run: python3 ../overrides/android/verify_short_approval_sound.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Export Android signing fingerprints
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          mkdir -p dist
          KEYSTORE=""
          for candidate in \
            "$HOME/.config/.android/debug.keystore" \
            "$HOME/.android/debug.keystore"; do
            if [ -f "$candidate" ]; then
              KEYSTORE="$candidate"
              break
            fi
          done

          if [ -z "$KEYSTORE" ]; then
            KEYSTORE="$(find "$HOME" -maxdepth 5 -type f -name "debug.keystore" -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$KEYSTORE" ]; then
            echo "Android signing keystore not found" | tee dist/VIB-SALES-SHA.txt
            exit 1
          fi

          {
            echo "VIB SALES ANDROID SIGNING FINGERPRINTS"
            echo "Keystore: $KEYSTORE"
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android
          } | tee dist/VIB-SALES-SHA.txt

      - name: Upload Android signing fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-SHA-FINGERPRINTS-${{ matrix.app }}
          # Both builds use the same restored signing key.
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-SHA.txt
          if-no-files-found: error

      - name: Upload manager APK
        if: matrix.app == 'manager'
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-MANAGER.apk
          if-no-files-found: error

      - name: Upload staff APK
        if: matrix.app == 'staff'
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-STAFF.apk
          if-no-files-found: error

  publish-direct-apks:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          path: manager-files

      - name: Publish manager APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vib-sales-manager-latest
          name: VIB Sales Manager
          target_commitish: ${{ github.sha }}
          body: "آخر نسخة مباشرة من تطبيق VIB Manager."
          files: manager-files/VIB-SALES-MANAGER.apk
          overwrite_files: true
          make_latest: false

  # Publish an installable APK only after tests, the release build, and
  # package/version/signature checks all succeed.
  publish-manager-login-fix:
    needs: [verify-rules, build]
    if: github.ref == 'refs/heads/feat/manager-return-invoices-20261105'
    runs-on: ubuntu-latest
    steps:
      - name: Download current manager build
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          path: manager

      - name: Verify in-place update matches the installed manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download vib-manager-0.2.63-login-recovery-20261105 --repo "$GITHUB_REPOSITORY" --pattern VIB-SALES-MANAGER.apk --dir previous
          NEW=manager/VIB-SALES-MANAGER.apk
          OLD=previous/VIB-SALES-MANAGER.apk
          test -s "$NEW"
          unzip -t "$NEW" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$SIGNER"
          BADGING="$("$AAPT" dump badging "$NEW" | head -n 3)"
          echo "$BADGING"
          grep -F "name='com.alaa.vibsales.managerscan'" <<< "$BADGING"
          grep -F "versionCode='8204'" <<< "$BADGING"
          grep -F "versionName='0.2.64'" <<< "$BADGING"
          "$SIGNER" verify --print-certs "$NEW" | tee /tmp/new-cert.txt
          "$SIGNER" verify --print-certs "$OLD" | tee /tmp/old-cert.txt
          NEW_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/new-cert.txt | head -1 | tr -d '[:space:]')"
          OLD_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/old-cert.txt | head -1 | tr -d '[:space:]')"
          test -n "$NEW_SHA"
          test "$NEW_SHA" = "$OLD_SHA"
          echo "Update package, code and signing certificate match previous release"
          sha256sum "$NEW" > manager/SHA256SUMS.txt

      - name: Publish standalone direct APK update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vib-manager-0.2.64-stable-dashboard-20261105
          name: VIB Manager 0.2.64 — Stable dashboard on launch
          target_commitish: ${{ github.sha }}
          body: |
            APK مباشر لتحديث مدير VIB فوق 0.2.63 دون حذف بيانات الجهاز.
            تثبيت شريط المزامنة في مكان واحد، ومنع وميض أرقام الملخص والاشتراكات المتكررة وقت الفتح، مع الاحتفاظ بإصلاحات الدخول السابقة.
            لا يمكن لهذا الإصدار تجاوز توقف مشروع Firebase عند نفاد الحصة؛ يلزم إصلاح Billing/Quota بصورة مستقلة.
          files: |
            manager/VIB-SALES-MANAGER.apk
            manager/SHA256SUMS.txt
          make_latest: false

  publish-manager-profit-cost-update:
    needs: [verify-rules, build]
    if: github.ref == 'refs/heads/fix/vib-manager-0-2-65-cost-profit-delete-20261109'
    runs-on: ubuntu-latest
    steps:
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          path: manager

      - name: Check update package, higher build number and exact signing identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download vib-manager-0.2.64-stable-dashboard-20261105 --repo "$GITHUB_REPOSITORY" --pattern VIB-SALES-MANAGER.apk --dir previous
          NEW=manager/VIB-SALES-MANAGER.apk
          OLD=previous/VIB-SALES-MANAGER.apk
          test -s "$NEW"
          unzip -t "$NEW" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging "$NEW" | head -n 3)"
          echo "$BADGING"
          grep -F "name='com.alaa.vibsales.managerscan'" <<< "$BADGING"
          grep -F "versionCode='8205'" <<< "$BADGING"
          grep -F "versionName='0.2.65'" <<< "$BADGING"
          "$SIGNER" verify --print-certs "$NEW" > /tmp/new-cert.txt
          "$SIGNER" verify --print-certs "$OLD" > /tmp/old-cert.txt
          NEW_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/new-cert.txt | head -1 | tr -d '[:space:]')"
          OLD_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/old-cert.txt | head -1 | tr -d '[:space:]')"
          test -n "$NEW_SHA"
          test "$NEW_SHA" = "$OLD_SHA"
          echo "Matched manager package and signing key; version 0.2.65 is an in-place update"
          sha256sum "$NEW" > manager/SHA256SUMS.txt

      - name: Publish direct 0.2.65 manager APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vib-manager-0.2.65-profit-cost-delete-20261109
          name: VIB Manager 0.2.65 — Historic profit cost and invoice line delete
          target_commitish: ${{ github.sha }}
          body: |
            تحديث مباشر فوق نسخة 0.2.64 للمدير، دون مسح بيانات الجهاز.
            زر مسح أحمر لكل صنف أثناء تحرير فاتورة البيع والشراء قبل الحفظ.
            عند تعديل فاتورة مبيعات قديمة، التحقق من آخر تكلفة شراء مثبتة قبل البيع لنفس كود واسم الصنف، بدل الإبقاء دائمًا على التكلفة القديمة.
            تعديل التكلفة لا يغير أرصدة العملاء أو الصندوق أو المخزون.
            لا تُعدل الفواتير السابقة تلقائيًا بمجرد تحديث سعر بطاقة الصنف.
          files: |
            manager/VIB-SALES-MANAGER.apk
            manager/SHA256SUMS.txt
          make_latest: false


  publish-manager-all-customer-payments:
    needs: [verify-rules, build]
    if: github.ref == 'refs/heads/fix/vib-manager-0-2-66-all-customer-payments-20261109'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          path: manager

      - name: Verify 0.2.66 is a signed install-over update to 0.2.65
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download vib-manager-0.2.65-profit-cost-delete-20261109 --repo "$GITHUB_REPOSITORY" --pattern VIB-SALES-MANAGER.apk --dir previous
          NEW=manager/VIB-SALES-MANAGER.apk
          OLD=previous/VIB-SALES-MANAGER.apk
          test -s "$NEW" && test -s "$OLD"
          unzip -t "$NEW" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          NEW_PACKAGE="$("$AAPT" dump badging "$NEW" | grep '^package:')"
          OLD_PACKAGE="$("$AAPT" dump badging "$OLD" | grep '^package:')"
          echo "$NEW_PACKAGE"
          grep -F "name='com.alaa.vibsales.managerscan'" <<< "$NEW_PACKAGE"
          grep -F "name='com.alaa.vibsales.managerscan'" <<< "$OLD_PACKAGE"
          grep -F "versionCode='10206'" <<< "$NEW_PACKAGE"
          grep -F "versionName='0.2.66'" <<< "$NEW_PACKAGE"
          grep -F "versionName='0.2.65'" <<< "$OLD_PACKAGE"
          "$SIGNER" verify --print-certs "$NEW" > /tmp/new_cert.txt
          "$SIGNER" verify --print-certs "$OLD" > /tmp/old_cert.txt
          NEW_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/new_cert.txt | head -n1 | tr -d '[:space:]')"
          OLD_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/old_cert.txt | head -n1 | tr -d '[:space:]')"
          test -n "$NEW_SHA"
          test "$NEW_SHA" = "$OLD_SHA"
          sha256sum "$NEW" > manager/SHA256SUMS.txt
          echo "In-place VIB Sales Manager 0.2.66 update validated."

      - name: Publish direct update installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vib-manager-0.2.66-complete-customer-payments-20261109
          name: VIB Manager 0.2.66 — Invoice payments and customer receipts
          target_commitish: ${{ github.sha }}
          body: |
            تحديث مباشر فوق 0.2.65 بنفس التوقيع واسم التطبيق، دون مسح بيانات المستخدم.
            تقارير حركة سداد العملاء وشاشة ملخص المدير تعرض المدفوع في فواتير المبيعات المكتملة بجانب سندات القبض النشطة.
            تمييز واضح بين رقم فاتورة البيع ورقم سند القبض، في الشاشة وPDF A4 و80 مم.
            استبعاد المبالغ التي أُلغي سدادها بالفواتير المعدلة أو سندات القبض الملغاة، وعدم احتساب حركة الصندوق المكررة.
            طباعة التقرير تتأكد من مطابقة البيانات المعروضة مع قاعدة البيانات الحية قبل الطباعة.
            لا يغير أرصدة العملاء أو المخزون، ولا يحل تجاوز Firebase للاستخدام المجاني.
          files: |
            manager/VIB-SALES-MANAGER.apk
            manager/SHA256SUMS.txt
          make_latest: false
