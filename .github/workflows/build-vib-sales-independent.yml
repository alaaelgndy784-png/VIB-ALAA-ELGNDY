name: Build Independent VIB Sales Apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'VIB-SALES-INDEPENDENT-SOURCE.zip'
      - '.github/workflows/build-vib-sales-independent.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract independent sales project
        run: |
          mkdir VIB-SALES-INDEPENDENT
          unzip -q VIB-SALES-INDEPENDENT-SOURCE.zip -d VIB-SALES-INDEPENDENT

      - name: Create independent Android platform
        working-directory: VIB-SALES-INDEPENDENT
        run: flutter create --platforms=android --org com.alaa.vibsales --project-name manager .

      - name: Prepare manager app
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          sed -i 's/^name: manager$/name: vib_sales/' pubspec.yaml
          sed -i 's/android:label="manager"/android:label="VIB MANAGER"/' android/app/src/main/AndroidManifest.xml
          perl -0pi -e "s/'role':\s*'pending',\s*'active':\s*false/'role': 'owner', 'active': true/g" lib/main.dart
          cp -r assets/icons/manager/mipmap-* android/app/src/main/res/
          cp firebase/google-services.json android/app/google-services.json
          flutter pub get

      - name: Build manager APK
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/VIB-SALES-MANAGER.apk

      - name: Build staff APK separately
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          sed -i 's/com\.alaa\.vibsales\.manager/com.alaa.vibsales.staff/g' android/app/build.gradle.kts
          sed -i 's/namespace = "com\.alaa\.vibsales\.staff"/namespace = "com.alaa.vibsales.manager"/' android/app/build.gradle.kts
          sed -i 's/com\.alaa\.vibsales\.manager/com.alaa.vibsales.staff/g' android/app/google-services.json
          sed -i 's/android:label="VIB MANAGER"/android:label="VIB STAFF"/' android/app/src/main/AndroidManifest.xml
          perl -0pi -e "s/'role':\s*'owner',\s*'active':\s*true/'role': 'pending', 'active': false/g" lib/main.dart
          cp -r assets/icons/staff/mipmap-* android/app/src/main/res/
          flutter clean
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/VIB-SALES-STAFF.apk

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-MANAGER.apk
          if-no-files-found: error

      - name: Upload staff APK
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-STAFF.apk
          if-no-files-found: error
