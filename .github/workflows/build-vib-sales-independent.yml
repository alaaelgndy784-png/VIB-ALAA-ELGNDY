name: Build Independent VIB Sales Apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'VIB-SALES-INDEPENDENT-SOURCE.zip'
      - '.github/workflows/build-vib-sales-independent.yml'
      - 'overrides/**'

jobs:
  verify-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: overrides/firebase/rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm test
        working-directory: overrides/firebase/rules-tests
  build:
    needs: verify-rules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [manager, staff]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: vib-sales-stable-android-signing-v1

      - name: Extract independent sales project
        run: |
          mkdir VIB-SALES-INDEPENDENT
          unzip -q VIB-SALES-INDEPENDENT-SOURCE.zip -d VIB-SALES-INDEPENDENT
          cp overrides/lib/*.dart VIB-SALES-INDEPENDENT/lib/
          mkdir -p VIB-SALES-INDEPENDENT/vib_overrides
          cp overrides/android/prepare_cheque_notifications.py VIB-SALES-INDEPENDENT/vib_overrides/
          cp overrides/pubspec.yaml VIB-SALES-INDEPENDENT/pubspec.yaml
          mkdir -p VIB-SALES-INDEPENDENT/test
          cp overrides/test/*.dart VIB-SALES-INDEPENDENT/test/
          mkdir -p VIB-SALES-INDEPENDENT/assets/tessdata
          printf '%s\n' '{"files":["ara.traineddata","eng.traineddata"]}' > VIB-SALES-INDEPENDENT/assets/tessdata_config.json
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata --output VIB-SALES-INDEPENDENT/assets/tessdata/ara.traineddata
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata --output VIB-SALES-INDEPENDENT/assets/tessdata/eng.traineddata
          mkdir -p VIB-SALES-INDEPENDENT/assets/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf VIB-SALES-INDEPENDENT/assets/fonts/DejaVuSans.ttf

      - name: Create independent Android platform
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          flutter create --platforms=android --org com.alaa.vibsales --project-name manager .
          python3 vib_overrides/prepare_cheque_notifications.py

      - name: Prepare manager app
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          printf '%s\n' 'android.newDsl=false' 'android.builtInKotlin=false' >> android/gradle.properties
          sed -i 's/^name: manager$/name: vib_sales/' pubspec.yaml
          sed -i 's/android:label="manager"/android:label="VIB MANAGER SCAN"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = "com.alaa.vibsales.manager"/applicationId = "com.alaa.vibsales.managerscan"/' android/app/build.gradle.kts
          grep -q 'applicationId = "com.alaa.vibsales.managerscan"' android/app/build.gradle.kts
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' android/app/src/main/kotlin/com/alaa/vibsales/manager/MainActivity.kt
          sed -i 's/FlutterActivity()/FlutterFragmentActivity()/' android/app/src/main/kotlin/com/alaa/vibsales/manager/MainActivity.kt
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          perl -0pi -e "s/'role':\s*'pending',\s*'active':\s*false/'role': 'owner', 'active': true/g" lib/main.dart
          cp -r assets/icons/manager/mipmap-* android/app/src/main/res/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../overrides/assets/manager-icon.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          cp firebase/google-services.json android/app/google-services.json
          flutter pub get

      - name: Verify invoice PDF rendering
        if: matrix.app == 'manager'
        working-directory: VIB-SALES-INDEPENDENT
        run: flutter test test/accounting_test.dart test/invoice_pdf_test.dart test/cheques_test.dart test/chat_alerts_test.dart

      - name: Upload invoice PDF previews
        if: matrix.app == 'manager'
        uses: actions/upload-artifact@v4
        with:
          name: VIB-INVOICE-PDF-PREVIEWS
          path: |
            VIB-SALES-INDEPENDENT/dist/*.pdf
            VIB-SALES-INDEPENDENT/dist/*.png
          if-no-files-found: error

      - name: Build manager APK
        if: matrix.app == 'manager'
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/VIB-SALES-MANAGER.apk

      - name: Build staff APK separately
        if: matrix.app == 'staff'
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          sed -i 's/android:label="VIB MANAGER SCAN"/android:label="VIB STAFF SCAN"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = "com.alaa.vibsales.managerscan"/applicationId = "com.alaa.vibsales.staffscan"/' android/app/build.gradle.kts
          grep -q 'applicationId = "com.alaa.vibsales.staffscan"' android/app/build.gradle.kts
          perl -0pi -e "s/'role':\s*'owner',\s*'active':\s*true/'role': 'pending', 'active': false/g" lib/main.dart
          cp -r assets/icons/staff/mipmap-* android/app/src/main/res/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../overrides/assets/staff-icon.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/VIB-SALES-STAFF.apk

      - name: Export Android signing fingerprints
        working-directory: VIB-SALES-INDEPENDENT
        run: |
          mkdir -p dist
          KEYSTORE=""
          for candidate in \
            "$HOME/.config/.android/debug.keystore" \
            "$HOME/.android/debug.keystore"; do
            if [ -f "$candidate" ]; then
              KEYSTORE="$candidate"
              break
            fi
          done

          if [ -z "$KEYSTORE" ]; then
            KEYSTORE="$(find "$HOME" -maxdepth 5 -type f -name "debug.keystore" -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$KEYSTORE" ]; then
            echo "Android signing keystore not found" | tee dist/VIB-SALES-SHA.txt
            exit 1
          fi

          {
            echo "VIB SALES ANDROID SIGNING FINGERPRINTS"
            echo "Keystore: $KEYSTORE"
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android
          } | tee dist/VIB-SALES-SHA.txt

      - name: Upload Android signing fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-SHA-FINGERPRINTS-${{ matrix.app }}
          # Both builds use the same restored signing key.
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-SHA.txt
          if-no-files-found: error

      - name: Upload manager APK
        if: matrix.app == 'manager'
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-MANAGER.apk
          if-no-files-found: error

      - name: Upload staff APK
        if: matrix.app == 'staff'
        uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          path: VIB-SALES-INDEPENDENT/dist/VIB-SALES-STAFF.apk
          if-no-files-found: error

