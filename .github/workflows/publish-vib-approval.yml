name: Publish VIB Sales 0.2.5 invoice history colors
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-vib-approval.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37622921301 --jq '[.head_sha,.conclusion] | join(" ")')" = "e114dae2fbad708b40b9247684e6fe9abfe194d5 success"
      - name: Download manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37622921301
          github-token: ${{ github.token }}
          path: download
      - name: Download employee APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37622921301
          github-token: ${{ github.token }}
          path: download
      - name: Validate and publish both APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import zipfile
          for path in ['download/VIB-SALES-MANAGER.apk','download/VIB-SALES-STAFF.apk']:
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None, path
                  assert 'AndroidManifest.xml' in apk.namelist(), path
          PY
          sha256sum download/*.apk > download/SHA256SUMS.txt
          gh release view vib-invoice-history-day-colors-20261007 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-invoice-history-day-colors-20261007 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB Sales 0.2.5 — invoice day colors' --notes 'Manager and employee apps, version 0.2.5 build 2007. Invoice history defaults to a rolling two-day view: today is fluorescent green and yesterday is red. The list refreshes at local midnight and when reopening after midnight. Sales and purchases are both included. Install over the matching existing manager and employee apps; manager and employee apps must keep their matching application IDs.'
          gh release upload vib-invoice-history-day-colors-20261007 download/VIB-SALES-MANAGER.apk download/VIB-SALES-STAFF.apk download/SHA256SUMS.txt --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber
