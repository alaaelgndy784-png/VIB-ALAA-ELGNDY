name: Build VIB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/catalog-gallery-20261005

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Preserve catalog development signing key
        id: catalog-signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vib-catalog-debug-signing-v1

      - name: Test catalog
        run: |
          gradle testAdminDebugUnitTest testCustomerDebugUnitTest || {
            python3 - <<'PYREPORT'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/*/*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      print(case.attrib.get('classname'), case.attrib.get('name'), (failure.text or '')[:3500])
          PYREPORT
            exit 1
          }

      - name: Build Admin and Customer APKs
        run: gradle assembleAdminDebug assembleCustomerDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: VIB-ADMIN-APK
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: VIB-CUSTOMER-APK
          path: app/build/outputs/apk/customer/debug/app-customer-debug.apk

      - name: Upload gallery preview
        uses: actions/upload-artifact@v4
        with:
          name: VIB-CATALOG-PREVIEW
          path: app/build/gallery-preview.png

      - name: Prepare Public APKs
        env:
          CATALOG_RELEASE_TAG: catalog-1.1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cp app/build/outputs/apk/customer/debug/app-customer-debug.apk VIB-CUSTOMER.apk
          cp app/build/outputs/apk/admin/debug/app-admin-debug.apk VIB-ADMIN.apk
          python3 - <<'PYMANIFEST'
          import hashlib, json, os, re
          from pathlib import Path
          config = Path('app/build.gradle.kts').read_text()
          code = int(re.search(r'versionCode = (\d+)', config).group(1))
          version = re.search(r'versionName = "([^"]+)"', config).group(1)
          tag = os.environ['CATALOG_RELEASE_TAG']
          manifest = {'versionCode': code, 'versionName': version, 'packageName': 'com.aistudio.sanitaryware.vibalaaelgndy', 'apkUrl': 'https://github.com/alaaelgndy784-png/VIB-ALAA-ELGNDY/releases/download/' + tag + '/VIB-CUSTOMER.apk', 'sha256': hashlib.sha256(Path('VIB-CUSTOMER.apk').read_bytes()).hexdigest()}
          Path('VIB-CATALOG-UPDATE.json').write_text(json.dumps(manifest, indent=2))
          PYMANIFEST

      - name: Publish immutable catalog update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_RELEASE_TAG: catalog-1.1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$CATALOG_RELEASE_TAG" VIB-CUSTOMER.apk VIB-ADMIN.apk VIB-CATALOG-UPDATE.json --target "$GITHUB_SHA" --title "VIB Catalog 1.1" --notes "صور متعددة وأزرار أصغر وتحديثات من المدير وإشعارات المنتجات الجديدة. يلزم تثبيت هذه النسخة مرة أولى لتفعيل التحديثات داخل التطبيق."

      - name: Publish Permanent Customer Download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view customer-latest >/dev/null 2>&1 || gh release create customer-latest --title "VIB Customer" --notes "نسخة العملاء الرسمية من تطبيق VIB"
          gh release upload customer-latest VIB-CUSTOMER.apk VIB-CATALOG-UPDATE.json --clobber

      - name: Publish Permanent Admin Download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view admin-latest >/dev/null 2>&1 || gh release create admin-latest --title "VIB Admin" --notes "نسخة المدير الرسمية من تطبيق VIB"
          gh release upload admin-latest VIB-ADMIN.apk --clobber
