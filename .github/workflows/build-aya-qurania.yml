name: Build Aya Qurania APK
on:
  push:
    branches:
      - aya-qurania-standalone
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aya-Qurania-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "aya-qurania-test-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk --target "${GITHUB_SHA}" --title "آية قرآنية - نسخة تجريبية ${GITHUB_RUN_NUMBER}" --notes "APK تجريبي لمكالمات صوت وفيديو بروابط Jitsi. تثبيت جانبي للاختبار، وليس نسخة إنتاج." --prerelease
