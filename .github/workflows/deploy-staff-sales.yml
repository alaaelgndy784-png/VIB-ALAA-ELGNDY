name: Deploy VIB Staff Sales Service
on:
  workflow_dispatch:
  push:
    paths:
      - 'overrides/firebase/functions/**'
      - '.github/workflows/deploy-staff-sales.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate transaction scenarios
        working-directory: overrides/firebase/functions
        run: npm test
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Firebase deployment credentials are missing; service has not been deployed."
            exit 1
          fi
      - name: Install deployment dependencies
        run: |
          npm install -g firebase-tools
          npm install --prefix overrides/firebase/functions
      - name: Deploy employee sale callable
        working-directory: overrides/firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/vib-firebase.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/vib-firebase.json"
            firebase deploy --only functions:createStaffSale,functions:appendInvoiceItems --project vib-sales --non-interactive
          else
            firebase deploy --only functions:createStaffSale,functions:appendInvoiceItems --project vib-sales --token "$FIREBASE_TOKEN" --non-interactive
          fi
