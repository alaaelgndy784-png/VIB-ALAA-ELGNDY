name: Package VIB Manager One Click

on:
  push:
    paths:
      - '.github/workflows/package-vib-manager-one-click.yml'
      - 'VIB-SALES-INDEPENDENT-SOURCE.zip'
      - 'overrides/**'
      - 'web-staff/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Prepare manager web build
        run: |
          mkdir -p web-project
          unzip -q VIB-SALES-INDEPENDENT-SOURCE.zip -d web-project
          cp overrides/lib/*.dart web-project/lib/
          cp overrides/pubspec.yaml web-project/pubspec.yaml
          cp overrides/assets/vip-logo.png web-project/assets/vip-logo.png
          mkdir -p web-project/assets/tessdata web-project/assets/fonts web-project/test
          printf '%s\n' '{"files":[]}' > web-project/assets/tessdata_config.json
          touch web-project/assets/tessdata/.keep
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf web-project/assets/fonts/DejaVuSans.ttf
          cp overrides/test/*.dart web-project/test/
          cd web-project
          flutter create --platforms=web --project-name vib_sales .
          cd ..
          python3 web-staff/prepare.py web-project manager

      - name: Build manager web
        working-directory: web-project
        run: flutter build web --release --no-wasm-dry-run --base-href /manager/

      - name: Create one-click Windows launcher
        run: |
          mkdir -p package/manager
          cp -R web-project/build/web/. package/manager/

          cat > package/VIB-Server.ps1 <<'PS1'
          $ErrorActionPreference = "Stop"
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $port = 8787
          $url = "http://localhost:$port/manager/"

          function Get-ContentType([string]$path) {
              switch ([IO.Path]::GetExtension($path).ToLowerInvariant()) {
                  ".html" { "text/html; charset=utf-8" }
                  ".js"   { "application/javascript" }
                  ".json" { "application/json" }
                  ".css"  { "text/css" }
                  ".png"  { "image/png" }
                  ".jpg"  { "image/jpeg" }
                  ".jpeg" { "image/jpeg" }
                  ".svg"  { "image/svg+xml" }
                  ".wasm" { "application/wasm" }
                  ".ttf"  { "font/ttf" }
                  ".otf"  { "font/otf" }
                  ".ico"  { "image/x-icon" }
                  default { "application/octet-stream" }
              }
          }

          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add("http://localhost:$port/")
          $listener.Start()
          Start-Process $url

          Write-Host ""
          Write-Host "VIB Manager is running." -ForegroundColor Green
          Write-Host "Keep this window open while using the program." -ForegroundColor Yellow
          Write-Host "Open: $url"
          Write-Host ""

          try {
              while ($listener.IsListening) {
                  $ctx = $listener.GetContext()
                  $reqPath = [Uri]::UnescapeDataString($ctx.Request.Url.AbsolutePath.TrimStart('/'))
                  if ([string]::IsNullOrWhiteSpace($reqPath)) { $reqPath = "manager/index.html" }

                  $filePath = Join-Path $root $reqPath
                  if ((Test-Path $filePath -PathType Container)) {
                      $filePath = Join-Path $filePath "index.html"
                  }
                  if (-not (Test-Path $filePath -PathType Leaf)) {
                      if ($reqPath.StartsWith("manager/")) {
                          $filePath = Join-Path $root "manager/index.html"
                      }
                  }

                  if (Test-Path $filePath -PathType Leaf) {
                      $bytes = [IO.File]::ReadAllBytes($filePath)
                      $ctx.Response.StatusCode = 200
                      $ctx.Response.ContentType = Get-ContentType $filePath
                      $ctx.Response.ContentLength64 = $bytes.Length
                      $ctx.Response.AddHeader("Cache-Control", "no-cache")
                      $ctx.Response.OutputStream.Write($bytes, 0, $bytes.Length)
                  } else {
                      $ctx.Response.StatusCode = 404
                  }
                  $ctx.Response.OutputStream.Close()
              }
          }
          finally {
              $listener.Stop()
              $listener.Close()
          }
          PS1

          cat > "package/START VIB MANAGER.bat" <<'BAT'
          @echo off
          chcp 65001 >nul
          title VIB Manager
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0VIB-Server.ps1"
          pause
          BAT

          cat > package/README-AR.txt <<'TXT'
          VIB SALES MANAGER - تشغيل على الكمبيوتر

          1) فك ضغط الملف بالكامل.
          2) افتح المجلد.
          3) اضغط مرتين على START VIB MANAGER.bat
          4) البرنامج سيفتح تلقائيا في المتصفح.
          5) اترك النافذة السوداء مفتوحة أثناء الاستخدام.
          TXT

      - name: Upload one-click package
        uses: actions/upload-artifact@v4
        with:
          name: VIB-MANAGER-WINDOWS-ONE-CLICK
          path: package/
          if-no-files-found: error
          retention-days: 90
