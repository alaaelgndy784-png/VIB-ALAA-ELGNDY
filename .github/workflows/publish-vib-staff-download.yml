name: Publish VIP invoice and receipt updates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37248301744 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "35951250f9c2d029f905cfbb8bcc9757e2d614e9 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37248301744
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37248301744
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish reports APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-Manager-Reports.apk
          mv download/VIB-SALES-STAFF.apk download/VIB-Staff-Reports.apk
          python3 - <<'PY'
          import zipfile
          for path in ['download/VIB-Manager-Reports.apk', 'download/VIB-Staff-Reports.apk']:
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None, path
                  assert 'AndroidManifest.xml' in apk.namelist(), path
          PY
          sha256sum download/VIB-Manager-Reports.apk download/VIB-Staff-Reports.apk > download/SHA256SUMS.txt
          gh release view vip-invoices-receipts-discounts-20261005 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vip-invoices-receipts-discounts-20261005 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIP invoice PDF, receipt dates and staff discounts — 5 October 2026' --notes 'VIP black and gold launcher icons, company header and shared A4/80mm invoice design. After-save sharing attaches a PDF through the Android share sheet. Customer receipts accept a chosen Cairo date and time used by repayment reports and account statements. Staff sale percentage discounts are computed from the product price; manual price changes require manager permission, and staff prices remain at or above cost. New manager invoice series starts at sales 1223 and purchases 431 without renumbering history or rewinding existing higher counters. Staff serials are assigned when reviewed by the manager. Employee discount, receipt-date and price-permission changes require the matching Firestore rules to be published. All 109 Firestore rules tests, 32 function tests and Flutter invoice/report/widget tests passed. Android version 2002 (0.2.0); install over the matching existing app.'
          gh release upload vip-invoices-receipts-discounts-20261005 download/VIB-Staff-Reports.apk download/VIB-Manager-Reports.apk download/SHA256SUMS.txt --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber
