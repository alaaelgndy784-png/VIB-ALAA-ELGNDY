name: Publish VIB dated movement and debt reports
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37235456280 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "e6dab2a8fc60fc02280aff4729c90d099b484a92 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37235456280
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37235456280
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish reports APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-Manager-Reports.apk
          mv download/VIB-SALES-STAFF.apk download/VIB-Staff-Reports.apk
          python3 - <<'PY'
          import zipfile
          for path in ['download/VIB-Manager-Reports.apk', 'download/VIB-Staff-Reports.apk']:
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None, path
                  assert 'AndroidManifest.xml' in apk.namelist(), path
          PY
          sha256sum download/VIB-Manager-Reports.apk download/VIB-Staff-Reports.apk > download/SHA256SUMS.txt
          gh release view vib-business-reports-20261004 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-business-reports-20261004 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB sales, purchases and debts reports — 4 October 2026' --notes 'Dated sales and purchase movement reports show invoice totals, dated returns and net movement. Customer and supplier debt reports show total debt and credit balances separately. Invoice cards show the green party name and invoice number with a receipt icon; full item details open on demand. Reports and individual invoices support PDF sharing. Calculation tests and Arabic PDF previews passed. Install over the matching existing app as an update.'
          gh release upload vib-business-reports-20261004 download/VIB-Staff-Reports.apk download/VIB-Manager-Reports.apk download/SHA256SUMS.txt --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber
