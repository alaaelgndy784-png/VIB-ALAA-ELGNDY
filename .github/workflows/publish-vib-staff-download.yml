name: Publish VIB dated invoice history downloads
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37123380513 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "bdb26987a51319ecaeae774f9da3edb9c9a6117f success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37123380513
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37123380513
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish invoice history APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-SALES-MANAGER-INVOICE-HISTORY.apk
          echo 'e8020802f34c60b5c19e5542d5c5575ae321bf14a5af0d2e70e951e1abfed2d2  download/VIB-SALES-MANAGER-INVOICE-HISTORY.apk' | sha256sum --check
          mv download/VIB-SALES-STAFF.apk download/VIB-SALES-STAFF-INVOICE-HISTORY.apk
          echo '6090ad91b519b3f541d301b089ce87e15710f9ba3bcd8adcc935de4ec9996bdb  download/VIB-SALES-STAFF-INVOICE-HISTORY.apk' | sha256sum --check
          gh release view vib-invoice-history-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-invoice-history-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB dated invoice history — 3 October 2026' --notes 'Tested manager and staff updates. Manager settings now opens sales and purchase invoice history for today or a selected calendar date. Existing inventory, returns and Geidea preparation are preserved. Install over the corresponding existing app without deleting it.'
          gh release upload vib-invoice-history-20261003 download/VIB-SALES-STAFF-INVOICE-HISTORY.apk download/VIB-SALES-MANAGER-INVOICE-HISTORY.apk --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber

