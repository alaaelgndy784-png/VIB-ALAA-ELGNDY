name: Publish VIB compact invoice fields
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37239980961 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "4ecebc4e4efc09aff5929edb55be339037fb13e0 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37239980961
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37239980961
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish reports APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-Manager-Reports.apk
          mv download/VIB-SALES-STAFF.apk download/VIB-Staff-Reports.apk
          python3 - <<'PY'
          import zipfile
          for path in ['download/VIB-Manager-Reports.apk', 'download/VIB-Staff-Reports.apk']:
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None, path
                  assert 'AndroidManifest.xml' in apk.namelist(), path
          PY
          sha256sum download/VIB-Manager-Reports.apk download/VIB-Staff-Reports.apk > download/SHA256SUMS.txt
          gh release view vib-compact-invoice-fields-20261005 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-compact-invoice-fields-20261005 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB compact invoice lookup and field selection — 5 October 2026' --notes 'Sales and purchase invoice lookup uses compact full-width cards with horizontal party names, invoice numbers, amounts and dates. The dialog adjusts to keyboard space and results scroll. Tapping editable quantity, unit price, total or discount selects the entire value, including repeated taps, so typing directly replaces it. Protected price fields remain disabled. Layout tests cover 320, 360 and 564 pixel widths with enlarged Arabic text and keyboard insets; screenshots were reviewed. Numeric replacement and existing accounting tests passed. Install over the matching existing app as an update.'
          gh release upload vib-compact-invoice-fields-20261005 download/VIB-Staff-Reports.apk download/VIB-Manager-Reports.apk download/SHA256SUMS.txt --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber
