name: Publish VIB numbered customer rows and green debt
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37149797589 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "0cd532de78e2c560e475a7cdcac3a71f8150c972 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37149797589
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37149797589
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish numbered customer row APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-Manager-Customers.apk
          echo 'ee1ffb10e68d077b33f9c2a2d91cc9aceafd1046acfe0c9d9c78d40b2ad22140  download/VIB-Manager-Customers.apk' | sha256sum --check
          mv download/VIB-SALES-STAFF.apk download/VIB-Staff-Customers.apk
          echo 'ef083dd0abe3f3a7b57231a8c2c89be5c880277f14e9e27fdb6e0c0c75b4db78  download/VIB-Staff-Customers.apk' | sha256sum --check
          gh release view vib-customer-rows-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-customer-rows-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB numbered customer rows — 3 October 2026' --notes 'Invoice customer selection shows sequential numbers on the right, customer names directly alongside and debt in green on the same row. Phone numbers are hidden from the list. Dialog adjusts to the keyboard. Existing account data and accounting remain intact. Small-phone layout and selection test passed. Install as an update over the corresponding app.'
          gh release upload vib-customer-rows-20261003 download/VIB-Staff-Customers.apk download/VIB-Manager-Customers.apk --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber

