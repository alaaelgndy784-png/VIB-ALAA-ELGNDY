name: Publish VIB A4 style 2 and invoice tools downloads
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37129620811 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "49129af5bf12f4ad2831adceccca5a121c336dc5 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37129620811
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37129620811
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish A4 style 2 APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-SALES-MANAGER-A4-STYLE-2.apk
          echo 'e36a094d850cc8472681102fa0a0d58c44354e6e9c1068c5d51a802917cd02ba  download/VIB-SALES-MANAGER-A4-STYLE-2.apk' | sha256sum --check
          mv download/VIB-SALES-STAFF.apk download/VIB-SALES-STAFF-A4-STYLE-2.apk
          echo '590698f2eb0261b898142ad2aaeaaf070863645767a3e72ed472061bef8d9158  download/VIB-SALES-STAFF-A4-STYLE-2.apk' | sha256sum --check
          gh release view vib-a4-style-2-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-a4-style-2-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB A4 style 2 and invoice tools — 3 October 2026' --notes 'Selected navy/gold A4 invoice layout for sales and purchases. Manager can create and select customer/supplier contacts inside invoice drafts, including first supplier and photographed purchases. Direct sales invoice editing adds or changes products on the same invoice with existing accounting and receipt protections. Existing thermal receipts, numbering/barcodes, inventory and returns preserved. Tested 78 Flutter cases plus 32 Node and 62 rules cases. Install over the corresponding existing app without deleting it.'
          gh release upload vib-a4-style-2-20261003 download/VIB-SALES-STAFF-A4-STYLE-2.apk download/VIB-SALES-MANAGER-A4-STYLE-2.apk --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber

