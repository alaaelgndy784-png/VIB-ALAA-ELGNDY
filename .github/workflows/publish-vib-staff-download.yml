name: Publish VIB repayment periods and invoice correction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37241911538 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "3944c56ef1af8f15ac03a18c58fda39ea9412375 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37241911538
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37241911538
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish reports APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-Manager-Reports.apk
          mv download/VIB-SALES-STAFF.apk download/VIB-Staff-Reports.apk
          python3 - <<'PY'
          import zipfile
          for path in ['download/VIB-Manager-Reports.apk', 'download/VIB-Staff-Reports.apk']:
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None, path
                  assert 'AndroidManifest.xml' in apk.namelist(), path
          PY
          sha256sum download/VIB-Manager-Reports.apk download/VIB-Staff-Reports.apk > download/SHA256SUMS.txt
          gh release view vib-repayment-period-customer-correction-20261005 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-repayment-period-customer-correction-20261005 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB dated repayments and invoice correction — 5 October 2026' --notes 'Customer repayment reports use explicit From, To and Confirm controls, inclusive Cairo dates, per-customer totals, dated voucher details, A4 and 80mm printing. Printing refreshes confirmed server data. Switching a cash invoice to credit resets paid to zero and supports partial payment. Invoice correction includes choosing the correct registered customer, atomic transfer of only the invoice debt between accounts, preserved invoice identity, audit records, and receipt guards. Customer reassignment requires deployment of the included Firestore rules; automatic deployment is currently blocked by missing Firebase repository credentials. Install as an update over the matching existing app.'
          gh release upload vib-repayment-period-customer-correction-20261005 download/VIB-Staff-Reports.apk download/VIB-Manager-Reports.apk download/SHA256SUMS.txt --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber
