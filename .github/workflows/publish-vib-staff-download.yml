name: Publish VIB invoice numbers and barcodes downloads
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37125094027 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "ce27934ea3339178ba025cf37f03cbfbf4454260 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37125094027
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37125094027
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish invoice history APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-SALES-MANAGER-INVOICE-NUMBERS.apk
          echo 'fcc9feb9b18ca60c4cfedc32651867544501373679f17aec7a961e624d5a961e  download/VIB-SALES-MANAGER-INVOICE-NUMBERS.apk' | sha256sum --check
          mv download/VIB-SALES-STAFF.apk download/VIB-SALES-STAFF-INVOICE-NUMBERS.apk
          echo 'f12e420725759ea13fb17477fcb2f53841c112ed8902088565d28b53b4a1152e  download/VIB-SALES-STAFF-INVOICE-NUMBERS.apk' | sha256sum --check
          gh release view vib-invoice-numbers-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-invoice-numbers-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB invoice numbers and barcodes — 3 October 2026' --notes 'Tested invoice numbering and printable Code128 barcodes. Purchases have persistent consecutive internal numbers separately from supplier invoice references. Manager sales are allocated on save; legacy and staff sales receive persistent numbers during manager review. Includes dated invoice history and existing inventory, returns and Geidea preparation. Install over the corresponding existing app without deleting it.'
          gh release upload vib-invoice-numbers-20261003 download/VIB-SALES-STAFF-INVOICE-NUMBERS.apk download/VIB-SALES-MANAGER-INVOICE-NUMBERS.apk --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber

