name: Publish VIB numbered inventory downloads
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37107158358 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "a65575a4851d8417032908a56bc0b01f7151ead2 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37107158358
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37107158358
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish inventory APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-SALES-MANAGER-NUMBERED-STOCK.apk
          echo '9c6a1c94341c9d8a7c7173827ea84f3f98069493f40c62ea1b8cdaaa4b584b09  download/VIB-SALES-MANAGER-NUMBERED-STOCK.apk' | sha256sum --check
          mv download/VIB-SALES-STAFF.apk download/VIB-SALES-STAFF-NUMBERED-STOCK.apk
          echo '21457f94a606f15cd7e09f1a4ab298210325115cf44198c6a189be7332690e7d  download/VIB-SALES-STAFF-NUMBERED-STOCK.apk' | sha256sum --check
          gh release view vib-numbered-stock-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-numbered-stock-20261003 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target ${{ github.sha }} --title 'VIB numbered inventory — 3 October 2026' --notes 'Tested manager and staff Android updates with numbered inventory and colored quantity, sale price, and total fields. Install over the corresponding existing app without deleting it.'
          gh release upload vib-numbered-stock-20261003 download/VIB-SALES-STAFF-NUMBERED-STOCK.apk download/VIB-SALES-MANAGER-NUMBERED-STOCK.apk --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber
