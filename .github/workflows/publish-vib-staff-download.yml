name: Publish VIB invoice history and green party names
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-vib-staff-download.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alaaelgndy784-png/VIB-ALAA-ELGNDY/actions/runs/37226743004 --jq '[.head_sha,.conclusion] | join(" ")' > source-run.txt
          test "$(cat source-run.txt)" = "8cf1b14d4332dbd430822324ea91d9fdd38ec504 success"
      - name: Download tested staff APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-STAFF-APK
          run-id: 37226743004
          github-token: ${{ github.token }}
          path: download
      - name: Download tested manager APK
        uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-MANAGER-APK
          run-id: 37226743004
          github-token: ${{ github.token }}
          path: download
      - name: Verify and publish purchase history APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv download/VIB-SALES-MANAGER.apk download/VIB-Manager-History.apk
          mv download/VIB-SALES-STAFF.apk download/VIB-Staff-History.apk
          python3 - <<'PY'
          import zipfile
          for path in ['download/VIB-Manager-History.apk', 'download/VIB-Staff-History.apk']:
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None, path
                  assert 'AndroidManifest.xml' in apk.namelist(), path
          PY
          sha256sum download/VIB-Manager-History.apk download/VIB-Staff-History.apk > download/SHA256SUMS.txt
          gh release view vib-purchase-history-20261004 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY >/dev/null 2>&1 || gh release create vib-purchase-history-20261004 --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --target 8cf1b14d4332dbd430822324ea91d9fdd38ec504 --title 'VIB purchase history update — 4 October 2026' --notes 'Customer and supplier names appear in bright green on sales and purchase invoice lists and dated history. Purchase history starts with 100 invoices and provides Show older invoices to increase the visible history by 100 at a time, continuing beyond the former 300 invoice cap. Rows render lazily; the active query persists across ordinary rebuilds. Existing invoices and accounting remain unchanged. Install over the matching existing app as an update.'
          gh release upload vib-purchase-history-20261004 download/VIB-Staff-History.apk download/VIB-Manager-History.apk download/SHA256SUMS.txt --repo alaaelgndy784-png/VIB-ALAA-ELGNDY --clobber
