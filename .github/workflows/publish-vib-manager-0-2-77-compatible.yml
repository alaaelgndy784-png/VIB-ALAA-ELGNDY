name: Publish Verified VIB Manager 0.2.77 Update

permissions:
  contents: write
  actions: read

on:
  push:
    paths:
      - '.github/workflows/publish-vib-manager-0-2-77-compatible.yml'
  workflow_dispatch:

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download tested VIB Manager 0.2.77 APK
        uses: actions/download-artifact@v4
        with:
          run-id: 44783874662
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: VIB-SALES-MANAGER-APK
          path: manager-files

      - name: Compare package, Android version and signing certificate to VIB Manager 0.2.76
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous-manager
          gh release download vib-manager-0.2.76-fifo-profit-20261115 --repo "$GITHUB_REPOSITORY" --pattern VIB-SALES-MANAGER.apk --dir previous-manager
          OLD=previous-manager/VIB-SALES-MANAGER.apk
          NEW=manager-files/VIB-SALES-MANAGER.apk
          test -s "$OLD"
          test -s "$NEW"
          unzip -t "$NEW" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$SIGNER"
          "$AAPT" dump badging "$NEW" > /tmp/new-manager-badging.txt
          "$AAPT" dump badging "$OLD" > /tmp/old-manager-badging.txt
          head -n 3 /tmp/new-manager-badging.txt
          head -n 3 /tmp/old-manager-badging.txt
          grep -F "name='com.alaa.vibsales.managerscan'" /tmp/new-manager-badging.txt
          grep -F "versionCode='12217'" /tmp/new-manager-badging.txt
          grep -F "versionName='0.2.77'" /tmp/new-manager-badging.txt
          grep -F "versionCode='12216'" /tmp/old-manager-badging.txt
          "$SIGNER" verify --print-certs "$NEW" | tee /tmp/new-manager-certificate.txt
          "$SIGNER" verify --print-certs "$OLD" | tee /tmp/old-manager-certificate.txt
          NEW_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/new-manager-certificate.txt | head -1 | tr -d '[:space:]')"
          OLD_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/old-manager-certificate.txt | head -1 | tr -d '[:space:]')"
          test -n "$NEW_SHA"
          test "$NEW_SHA" = "$OLD_SHA"
          echo "Verified in-place update: manager package unchanged, version advanced 12216 -> 12217 and APK signing matched"
          sha256sum "$NEW" > manager-files/SHA256SUMS.txt

      - name: Publish verified manager APK direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vib-sales-manager-latest
          name: VIB Sales Manager
          target_commitish: ${{ github.sha }}
          body: "VIB Manager 0.2.77 - inline editable sales price in purchase invoice. Verified same app identity and signing certificate as manager 0.2.76."
          files: manager-files/VIB-SALES-MANAGER.apk
          overwrite_files: true
          make_latest: false
