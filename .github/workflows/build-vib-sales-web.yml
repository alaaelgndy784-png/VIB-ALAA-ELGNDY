name: Build VIB Sales Web for computers

on:
  workflow_dispatch:
  push:
    paths:
      - 'VIB-SALES-INDEPENDENT-SOURCE.zip'
      - 'overrides/**'
      - 'web-staff/**'
      - '.github/workflows/build-vib-sales-web.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [manager]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Extract app and apply web mode
        run: |
          mkdir web-project
          unzip -q VIB-SALES-INDEPENDENT-SOURCE.zip -d web-project
          cp overrides/lib/*.dart web-project/lib/
          cp overrides/pubspec.yaml web-project/pubspec.yaml
          cp overrides/assets/vip-logo.png web-project/assets/vip-logo.png
          mkdir -p web-project/assets/tessdata web-project/assets/fonts web-project/test
          printf '%s\n' '{"files":[]}' > web-project/assets/tessdata_config.json
          touch web-project/assets/tessdata/.keep
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf web-project/assets/fonts/DejaVuSans.ttf
          cp overrides/test/*.dart web-project/test/
          cd web-project
          flutter create --platforms=web --project-name vib_sales .
          cd ..
          python3 web-staff/prepare.py web-project ${{ matrix.app }}
      - name: Verify invoice and account calculations
        working-directory: web-project
        run: flutter test test/accounting_test.dart test/invoice_serial_core_test.dart test/invoice_pdf_test.dart
      - name: Build browser app
        working-directory: web-project
        run: flutter build web --release --no-wasm-dry-run --base-href /${{ matrix.app }}/
      - uses: actions/upload-artifact@v4
        with:
          name: VIB-SALES-${{ matrix.app }}-WEB
          path: web-project/build/web/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VIB-SALES-manager-WEB
          path: web-artifacts
      - name: Assemble manager Hosting path
        run: |
          mkdir -p public/manager
          cp -R web-artifacts/. public/manager/
          cat > firebase.json <<'JSON'
          {"hosting":{"site":"vib-sales","public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"rewrites":[{"source":"/manager/**","destination":"/manager/index.html"}],"headers":[{"source":"/manager/index.html","headers":[{"key":"Cache-Control","value":"no-cache"}]}]}}
          JSON
      - name: Check Firebase Hosting credentials
        id: hosting
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Web builds are ready, but publishing needs the FIREBASE_HOSTING_SERVICE_ACCOUNT repository secret."
          else
            printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/vib-firebase.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/vib-firebase.json" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish manager web app to Firebase Hosting
        if: steps.hosting.outputs.available == 'true'
        run: |
          npm install --prefix web-staff --no-save google-auth-library firebase-tools
          node web-staff/publish-computer.mjs
